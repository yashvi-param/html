<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>width and height</title>
</head>
<body>
    <h2>The alt attribute</h2>
    <p>The alt attribute should reflect the image content, so users who cannot see the image get an understanding of what the image contains:</p>
    <img src="https://www.w3schools.com/html/img_girl.jpg" alt="girl standing and she wear jacket" width="500" height="500">
</body>
</html>
