<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors, Fonts and Sizes</title>
    <head>
        <style>
            h1{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color: blue;
                font-size: 300%;
            }

            p{
                color: red;
                font-family: courier;
                font-size: 160%;
            }
        </style>
    </head>
</head>
<body>
    
    <h1>This is a heading</h1>
    <p>This is a paragraph.</p>
    
</body>
</html>
